:root{color-scheme:dark;--bg:#0a1430;--surface:#13203f;--surface-2:#1a2a4e;--border:#2b3c66;--text:#eef1fa;--muted:#aab4d2;--danger:#ff9b90;--danger-bg:#4a2432;--ok:#3f9a55;--gold:#e3c272;--sea:#5fd0e4;--hand:"851 Tegaki Zatsu","Hiragino Sans","Noto Sans JP",sans-serif;--r:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:56px}
body{font-family:var(--hand);background:var(--bg);color:var(--text);line-height:1.7;font-size:14px}
.cover{position:relative;overflow:hidden;background:linear-gradient(#03071a,var(--surface));border-bottom:1px solid var(--border);padding:52px 24px 34px;text-align:center}
.cover i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite alternate}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--sea);margin-bottom:14px;position:relative}
.ctitle{font-size:30px;line-height:1.4;margin-bottom:14px;position:relative}
.meta{display:flex;justify-content:center;gap:6px 22px;flex-wrap:wrap;font-size:12px;color:var(--muted);position:relative}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:12px 15px;font:12px var(--hand);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);background:var(--surface);border-bottom-color:var(--gold)}
.page{display:none;padding:24px 16px 48px;max-width:720px;margin:0 auto}.page.on{display:block;animation:pin .35s ease both}
.dh{font-size:18px;padding-bottom:8px;margin:24px 0 10px;border-bottom:1px solid var(--border)}.page>.dh:first-child{margin-top:0}
.dh::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold));margin-right:8px;vertical-align:middle}
.alert{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--sea);border-radius:var(--r);padding:12px 16px;margin:8px 0 16px;font-size:13px}
.alert.warn{background:var(--danger-bg);border-left-color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}
.row.move{padding:4px 16px;background:var(--surface-2);color:var(--muted);font-size:12px}
.time{font-size:12px;color:var(--muted);min-width:52px;padding-top:2px;flex:none}
.main{flex:1;min-width:0}.name{font-size:14px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.badge{flex:none;align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:0;font-family:var(--hand)}
.b-warn{background:var(--danger-bg);color:var(--danger)}.b-ok{background:#1d4a30;color:#8fe0a8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}.stat b{display:block;font-size:11px;color:var(--muted);font-weight:400}.stat span{font-size:16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);color:var(--muted);font-weight:400;padding:8px 12px;text-align:left;font-size:11px}td{padding:8px 12px;border-bottom:1px solid var(--border)}
.r{text-align:right;white-space:nowrap}tr.tot td{border-top:2px solid var(--gold);color:var(--gold);font-size:15px}
.bar{height:10px;background:var(--surface-2);border-radius:5px;position:relative;margin:10px 0 4px}.bar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--sea),var(--gold));border-radius:5px}.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--danger)}
ul.ck{list-style:none}.ck li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}.ck li:last-child{border:0}
.ck input{width:18px;height:18px;accent-color:var(--gold);flex:none}.ck li.d span{opacity:.45;text-decoration:line-through}.ck li.d input{animation:pop .4s}
.gh{font-size:11px;color:var(--muted);padding:8px 16px 4px;letter-spacing:.06em;border-top:1px solid var(--border)}.gh:first-child{border:0}
select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font:12px var(--hand)}
details{margin-bottom:8px}summary{cursor:pointer;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);list-style:none}
details[open] summary{border-radius:var(--r) var(--r) 0 0}details .card{border-top:0;border-radius:0 0 var(--r) var(--r)}
@keyframes tw{from{opacity:.15}to{opacity:1}}@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pop{50%{transform:scale(1.5)}}
#op{display:none;position:fixed;inset:0;z-index:1000;overflow:hidden;background:#03071a;touch-action:none}
#op.on{display:block}#op.playing{animation:ofade 9.6s linear both}
@keyframes ofade{0%{opacity:0}6%{opacity:1}92%{opacity:1}100%{opacity:0}}@keyframes oin{from{opacity:0}to{opacity:1}}
#op *{box-sizing:border-box}
.sc{position:absolute;inset:0;transform-origin:50% 68%;background:linear-gradient(180deg,#03071a 0,#0a1430 45%,#14306b 70%,#0b1a3c 100%)}
#op.playing .sc{animation:ocam 8.6s cubic-bezier(.2,.6,.2,1) both}@keyframes ocam{from{transform:scale(1.2)}to{transform:scale(1)}}
.sky{position:absolute;inset:0;opacity:0}#op.playing .sky{animation:oin 1.6s ease .2s both}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.2s ease-in-out infinite alternate}
.cl{position:absolute;width:70vw;height:26vh;border-radius:50%;filter:blur(22px);opacity:0;background:radial-gradient(closest-side,rgba(190,205,240,.3),rgba(190,205,240,.08))}
.cl.l{left:-10vw;top:30vh}.cl.r{right:-10vw;top:40vh}
#op.playing .cl.l{animation:cl1 4.4s linear .3s both}#op.playing .cl.r{animation:cl2 4.4s linear .8s both}
@keyframes cl1{0%{opacity:0;transform:translate(20vw,0)}25%{opacity:1}100%{opacity:0;transform:translate(-10vw,-6vh) scale(1.3)}}
@keyframes cl2{0%{opacity:0;transform:translate(-20vw,0)}25%{opacity:1}100%{opacity:0;transform:translate(10vw,-6vh) scale(1.3)}}
.glow{position:absolute;left:50%;bottom:8vh;width:160vw;height:55vh;margin-left:-80vw;border-radius:50%;opacity:0;background:radial-gradient(ellipse at 50% 100%,rgba(227,194,114,.4),rgba(95,208,228,.16) 45%,transparent 70%)}
#op.playing .glow{animation:oin 1.8s ease 2s both}
.moon{position:absolute;right:14%;top:30%;width:44px;height:44px;border-radius:50%;background:#fff6d6;box-shadow:0 0 30px 8px rgba(255,246,214,.35);opacity:0}#op.playing .moon{animation:oin 2s ease 1s both}
.pl{position:absolute;top:22%;left:-10%;font-size:22px;opacity:0}#op.playing .pl{animation:plf 3.4s linear .6s both}
@keyframes plf{0%{opacity:0;transform:translate(0,10vh)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(120vw,-8vh)}}
.ss{position:absolute;top:8%;left:90%;width:130px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;transform:rotate(-28deg)}
#op.playing .ss{animation:ssh 2s ease-in 1.6s both}@keyframes ssh{0%{opacity:0;transform:translate(0,0) rotate(-28deg)}8%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(-62vw,32vh) rotate(-28deg)}}
.bu{position:absolute;left:30%;top:24%}.bu b{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0}
#op.playing .bu b{animation:bp 1.7s cubic-bezier(.1,.7,.3,1) 3.4s both}
@keyframes bp{0%{opacity:0;transform:translate(0,0)}8%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.cw{position:absolute;left:0;right:0;bottom:11vh;display:flex;justify-content:center;pointer-events:none}
.ci{position:relative;width:clamp(300px,min(120vw,56vh),720px);opacity:0}#op.playing .ci{animation:rise 2.2s cubic-bezier(.2,.7,.2,1) 1.9s both}
@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.92)}to{opacity:1;transform:none}}
.ci svg{display:block;width:100%;height:auto}.rf{transform:scaleY(-1);opacity:.28;margin-top:-2px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
.wv{position:absolute;left:0;right:0;top:99%;height:16vh;background:linear-gradient(180deg,transparent 0,transparent 3px,rgba(95,208,228,.28) 3px,rgba(95,208,228,.28) 5px,transparent 5px);background-size:100% 11px}
#op.playing .wv{animation:wvm 2.6s linear infinite}@keyframes wvm{to{background-position:0 11px}}
.win{fill:#ffe9a8;opacity:0}#op.playing .win{animation:wn 1.1s ease both}@keyframes wn{0%{opacity:0}40%{opacity:1}70%{opacity:.55}100%{opacity:1}}
.palm{position:absolute;bottom:9vh;width:90px;height:auto;transform-origin:50% 100%;opacity:0}
.palm.a{left:-8px}.palm.b{right:-14px;transform:scaleX(-1)}#op.playing .palm{animation:oin 1.5s ease 3.4s both,sway 4s ease-in-out 3.4s infinite alternate}
@keyframes sway{from{rotate:-2deg}to{rotate:3deg}}
.tt{position:absolute;top:7%;left:24px;right:24px;z-index:2;text-align:center}
.tt span{display:block;opacity:0}.eb{font-size:12px;letter-spacing:.3em;color:#ffe9a8;text-shadow:0 1px 6px #03071a;margin-bottom:8px}
.nm{font-size:clamp(32px,9vw,46px);line-height:1.3;color:#fff;letter-spacing:.08em;text-shadow:0 2px 4px #03071a,0 0 28px rgba(227,194,114,.6)}
.dt{font-size:18px;letter-spacing:.22em;color:#fff;margin-top:8px;text-shadow:0 1px 6px #03071a}
#op.playing .eb{animation:oin .8s ease 3s both}#op.playing .nm{animation:onm 1.5s ease-out 3.2s both}#op.playing .dt{animation:oin .8s ease 4.4s both}
@keyframes onm{from{opacity:0;letter-spacing:.35em}to{opacity:1;letter-spacing:.08em}}
.skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--gold);background:rgba(10,20,48,.6);color:var(--gold);font:700 13px var(--hand);cursor:pointer;opacity:0}
#op.playing .skip{animation:oin .6s ease .5s both}
.page.on .dh{animation:pin .4s both}.page.on .row{animation:rin .45s ease both}
